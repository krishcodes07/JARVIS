jarvis:
  name: JARVIS
  version: 0.1.0
  persona: professional_assistant
  log_level: INFO
provider:
  active: groq
  model: llama-3.3-70b-versatile
  temperature: 0.7
  max_tokens: 4096
  top_p: 1.0
  thinking: true
  fallback:
    enabled: true
    provider: openrouter
    model: anthropic/claude-sonnet-4
memory:
  conversation:
    enabled: true
    backend: json
    max_messages: 100
    auto_summarize: true
    summarize_after: 50
  long_term:
    enabled: true
    auto_extract: true
    provider: ''
    model: ''
    storage_path: workspace/long_term_memory
  vector:
    enabled: true
    backend: chromadb
    embedding_provider: openai
    embedding_model: text-embedding-3-small
    chunk_size: 512
    chunk_overlap: 50
    collection_name: jarvis_memory
    storage_path: workspace/vector_store
    knowledge_base_path: workspace/knowledge_base
tools:
  enabled: true
  auto_approve: false
  max_turns: 25
  timeout: 30
  max_retries: 2
  sandbox:
    enabled: true
    workspace: .
    extra_paths: []
    blocked_commands: []
  always_include:
  - list_tools
  - get_schema
  - list_directory
  - read_file
  - write_file
  - edit_file
  - append_file
  - make_directory
  - delete_file
  - web_search
  - read_url
  - get_skill
  categories:
    basic: true
    filesystem: true
    system: true
    code: true
    desktop: true
automation:
  enabled: true
  grounding_mode: uia
  max_steps: 30
  step_delay: 0.5
  emergency_hotkey: ctrl+alt+q
  failsafe: true
  human_mouse_speed: true
  mouse_speed_seconds: 0.3
  screenshot_downscale: 1.0
  protected_apps:
    - 1password
    - bitwarden
    - keepass
    - lastpass
    - authenticator
    - windows security
  require_confirmation_for_sensitive: true
  log_screenshots: true
skills:
  enabled: true
  skills_dir: src/jarvis/skills
  disabled_skills: []
mcp:
  enabled: true
  auto_start: []
  timeout: 90
  servers_config: src/jarvis/mcp/servers.json
  servers: {}
voice:
  enabled: false
  mode: text
  auto_send_msg: true
  tts:
    provider: edge_tts
    voice: en-US-JennyNeural
    model: ''
    rate: +0%
    volume: +0%
    pitch: +0Hz
    stream: true
    output_format: mp3_44100_128
  stt:
    provider: sr
    engine: google
    model: base
    language: en-US
    device: auto
    compute_type: default
    download_root: ''
    energy_threshold: 300.0
    pause_threshold: 0.8
    max_duration: 30.0
    sample_rate: 16000
  audio:
    input_device: null
    output_device: null
    sample_rate: 44100
ui:
  default: tui
  tui:
    theme: dark
    show_tool_output: true
    show_thinking: false
  web:
    host: 0.0.0.0
    port: 8000
    debug: false
    theme: dark
  gui:
    theme: dark
    window_size: 1200x800
    opacity: 0.95
connectors:
  enabled: true
  telegram:
    enabled: false
    bot_token: ''
    allowed_users: []
    polling_timeout: 30
    send_typing: true
    max_message_length: 4000
  discord:
    enabled: false
    bot_token: ''
    allowed_channels: []
    allowed_users: []
    allowed_guilds: []
    send_typing: true
    max_message_length: 2000
