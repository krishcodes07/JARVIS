jarvis:
  name: JARVIS/
  version: 0.1.0
  persona: professional_assistant
  log_level: INFO
provider:
  active: google
  model: gemini-3.5-flash
  temperature: 0.7
  max_tokens: 16000
  top_p: 1.0
  fallback:
    enabled: true
    provider: kilo
    model: kilo-auto/free
memory:
  conversation:
    enabled: true
    backend: json
    max_messages: 30
    auto_summarize: true
    summarize_after: 20
  long_term:
    enabled: true
    auto_extract: true
    provider: groq
    model: llama-3.3-70b-versatile
    storage_path: data/long_term_memory
  vector:
    enabled: true
    backend: chromadb
    embedding_provider: openrouter
    embedding_model: nvidia/nemotron-3-embed-1b:free
    chunk_size: 512
    chunk_overlap: 50
    collection_name: jarvis_memory
    storage_path: data/vector_store
    knowledge_base_path: data/knowledge_base
tools:
  enabled: true
  auto_approve: true
  max_turns: 100
  timeout: 30
  max_retries: 2
  sandbox:
    enabled: false
    workspace: .
    extra_paths: []
    blocked_commands: []
  rag:
    enabled: true
    top_k: 15
    always_include:
    - get_mcps
    - get_tools
    - list_directory
    - read_file
    - write_file
    - edit_file
    - append_file
    - make_directory
    - delete_file
  categories:
    basic: true
    filesystem: true
    system: true
    code: true
mcp:
  enabled: true
  auto_start: []
  timeout: 90
  servers_config: src/jarvis/mcp/servers.json
  servers: {}
voice:
  enabled: true
  mode: voice
  auto_send_msg: false
  tts:
    provider: edge_tts
    voice: en-GB-RyanNeural
    model: eleven_multilingual_v2
    rate: +0%
    volume: +0%
    pitch: +0Hz
    stream: true
    output_format: mp3_44100_128
  stt:
    provider: sr
    engine: google
    model: base
    language: en-US
    device: auto
    compute_type: default
    download_root: ''
    energy_threshold: 300.0
    pause_threshold: 0.8
    max_duration: 30.0
    sample_rate: 16000
  audio:
    input_device: null
    output_device: null
    sample_rate: 44100
ui:
  default: tui
  tui:
    theme: mercury
    show_tool_output: true
    show_thinking: false
  web:
    host: 0.0.0.0
    port: 8000
    debug: false
    theme: dark
  gui:
    theme: dark
    window_size: 1200x800
    opacity: 0.95
