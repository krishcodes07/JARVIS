<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS — AI Assistant</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">🤖</div>
        <div class="brand-text">
          <h1>J.A.R.V.I.S.</h1>
          <span>AI Systems Online</span>
        </div>
      </div>

      <div class="sidebar-section">
        <span class="section-title">Active Provider</span>
        <select id="providerSelect" class="select-box">
          <option value="">Loading providers...</option>
        </select>
      </div>

      <div class="sidebar-section">
        <span class="section-title">Active Model</span>
        <select id="modelSelect" class="select-box">
          <option value="">Loading models...</option>
        </select>
      </div>

      <div class="sidebar-section">
        <span class="section-title">System Status</span>
        <div class="status-pill">
          <div class="status-dot"></div>
          <span>Core Subsystems Active</span>
        </div>
      </div>
    </aside>

    <!-- Main Chat -->
    <main class="main-chat">
      <header class="chat-header">
        <div class="header-title">
          <span>⚡</span>
          <span>JARVIS Conversation</span>
        </div>
      </header>

      <div id="chatMessages" class="chat-messages">
        <!-- Messages will be appended here -->
        <div class="message-row jarvis">
          <div class="message-avatar">🤖</div>
          <div class="message-bubble">
            Good day, sir. How may I assist you today?
          </div>
        </div>
      </div>

      <div class="input-container">
        <input type="text" id="chatInput" class="chat-input" placeholder="Type a message or instruction..." />
        <button id="btnSend" class="btn-send">Send</button>
      </div>
    </main>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
