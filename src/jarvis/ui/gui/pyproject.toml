[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-gui"
version = "0.1.0"
description = "A reusable, themeable PySide6 interface for JARVIS."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
jarvis-gui = "jarvis_gui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

