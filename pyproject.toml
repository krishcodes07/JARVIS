[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS — The Ultimate AI Assistant. Multi-UI, multi-provider, tool-calling, MCP-powered, skill-augmented AI agent."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11.4"
authors = [
    {name = "Krish"},
]
keywords = ["ai", "assistant", "jarvis", "llm", "mcp", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "rich>=13.0",
    "pillow>=10.0",

    # LLM Providers
    "openai>=1.50",
    "anthropic>=0.40",
    "google-genai>=1.0",

    # Memory
    "chromadb>=0.5",

    # MCP
    "mcp>=1.0,<2.0",

    # Web UI
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13.0",
    "jinja2>=3.1",

    # TUI
    "textual>=1.0",
    "pyperclip>=1.8.0",

    # GUI
    "customtkinter>=5.2",
]

[project.optional-dependencies]
mcp = [
    "openpyxl>=3.1",
    "telethon>=1.36",
]
voice = [
    "edge-tts>=7.0",
    "elevenlabs>=1.0",
    "SpeechRecognition>=3.10",
    "sounddevice>=0.5",
    "numpy>=1.24",
    "miniaudio>=1.60",
    "faster-whisper>=1.0",
    "pyaudio>=0.2.14",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# ASCII art logo intentionally uses trailing spaces for alignment.
"src/jarvis/ui/tui/widgets/header.py" = ["W291"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
